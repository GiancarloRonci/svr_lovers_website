<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- Grafica per le attività di Cultura&Turismo ancora senza curatore: tre figure, quella al centro alza la mano -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe2"/>
      <stop offset="1" stop-color="#e6dfc8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#sfondo)"/>
  <!-- colline sullo sfondo -->
  <path d="M0 290 C 90 240, 170 250, 250 275 S 400 250, 480 265 L 480 360 L 0 360 Z" fill="#cfd6b4"/>
  <path d="M0 315 C 110 285, 210 300, 300 315 S 430 300, 480 305 L 480 360 L 0 360 Z" fill="#b3c08a"/>

  <!-- figura a sinistra -->
  <g fill="#8a9a5b">
    <circle cx="140" cy="168" r="26"/>
    <path d="M96 290 C 96 230, 112 205, 140 205 C 168 205, 184 230, 184 290 Z"/>
  </g>
  <!-- figura a destra -->
  <g fill="#8a9a5b">
    <circle cx="340" cy="168" r="26"/>
    <path d="M296 290 C 296 230, 312 205, 340 205 C 368 205, 384 230, 384 290 Z"/>
  </g>
  <!-- figura al centro con la mano alzata -->
  <g fill="#4d5c2a">
    <circle cx="240" cy="150" r="31"/>
    <path d="M188 300 C 188 228, 207 192, 240 192 C 273 192, 292 228, 292 300 Z"/>
    <path d="M268 205 L 300 120 L 318 128 L 288 214 Z"/>
    <circle cx="310" cy="114" r="15"/>
  </g>

  <!-- distintivo "+" -->
  <g transform="translate(372 92)">
    <circle r="38" fill="#c9862d"/>
    <circle r="38" fill="none" stroke="#fbf9f4" stroke-width="5"/>
    <rect x="-6" y="-22" width="12" height="44" rx="3" fill="#fbf9f4"/>
    <rect x="-22" y="-6" width="44" height="12" rx="3" fill="#fbf9f4"/>
  </g>
</svg>
